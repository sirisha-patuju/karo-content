<!doctype html><html><head><meta charset="utf-8"><style>

#fade{position:absolute;inset:0;background:#05001a;opacity:0;z-index:61;pointer-events:none}
.scene{position:absolute;inset:0;display:none;perspective:2600px;overflow:hidden}

.ecard .tx{padding:20px 26px}
.ecard .tt{font-size:30px;font-weight:800}.ecard .ts{font-size:25px;color:#5a5f7c;font-weight:600;margin-top:4px}

/* chips */
.chip{position:absolute;display:flex;align-items:center;gap:20px;padding:26px 40px;border-radius:40px;background:rgba(255,255,255,.96);color:#1b1d2a;font-size:46px;font-weight:800;box-shadow:0 40px 100px rgba(0,0,0,.5),0 0 100px rgba(91,141,255,.45)}

/* languages */
.lang{position:absolute;width:560px;background:#1c0a66;border:1px solid rgba(255,255,255,.22);border-radius:30px;padding:18px;box-shadow:0 90px 180px rgba(0,0,0,.6),0 0 140px rgba(91,141,255,.5)}

/* morning */

.rays{position:absolute;left:55%;top:-30%;width:1400px;height:1800px;background:conic-gradient(from 195deg at 50% 0%,rgba(255,226,180,0) 0deg,rgba(255,226,180,.45) 8deg,rgba(255,226,180,0) 16deg,rgba(255,226,180,.3) 26deg,rgba(255,226,180,0) 34deg,rgba(255,226,180,.35) 44deg,rgba(255,226,180,0) 54deg);filter:blur(12px);mix-blend-mode:screen}

/* cta */
.cta{display:inline-flex;align-items:center;gap:22px;background:var(--orange);color:#fff;font-size:62px;font-weight:800;letter-spacing:-.02em;padding:36px 84px;border-radius:100px;box-shadow:0 30px 100px rgba(249,115,22,.55),inset 0 2px 0 rgba(255,255,255,.4)}

.cursor{display:inline-block;width:12px;height:125px;background:#fff;margin-left:14px;vertical-align:-14px}

#cut{position:absolute;inset:0;z-index:50;display:none;overflow:hidden;background:radial-gradient(ellipse at 50% 50%,#2a0f9a 0%,#120056 55%,#07001f 100%)}

</style></head>
<body>
<div id="stage">
  <div id="warm"></div>
  <div class="aur" id="a1"></div><div class="aur" id="a2"></div><div class="aur" id="a3"></div>
  <div id="bokeh"></div>
  <div id="scenes"></div>
  <div id="cut">
    <div class="cc" id="cA"><div class="nc" id="nA1" style="top:560px;left:40px"><i></i><div><b></b><span></span></div></div>
      <div class="nc" id="nA2" style="top:780px;left:20px"><i style="background:linear-gradient(135deg,#2563EB,#60a5fa)"></i><div><b></b><span></span></div></div>
      <div class="nc" id="nA3" style="top:1000px;left:60px"><i style="background:linear-gradient(135deg,#06C167,#0b7a43)"></i><div><b></b><span></span></div></div>
      <div class="badge" id="bA"></div></div>
    <div class="cc" id="cB"><div class="ev2" id="eB1" style="left:60px;top:640px;background:#2563EB"></div>
      <div class="ev2" id="eB2" style="left:260px;top:820px;background:#7c3aed"></div>
      <div class="ev2" id="eB3" style="left:160px;top:1000px;background:#db2777"></div>
      <div class="clashlbl" id="lB"></div></div>
    <div class="cc" id="cC"><div class="tbox"><span id="tC"></span><span id="curC" style="color:#60a5fa">|</span></div><div class="sub" id="subC"></div></div>
    <div class="cc" id="cD"><div class="tick"><svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg></div><div class="big" style="margin-top:50px;font-size:118px" id="dT"></div><div class="sub" id="dS"></div></div>
  </div>
  <div id="grain"></div><div id="vig"></div><div id="flash"></div><div id="fade"></div>
</div>
<script>
const SPEC=/*SPEC*/null;
const SCHED=/*SCHED*/null;
const S=SCHED.S, TOTAL=SCHED.total, SCN=SPEC.scenes, N=SCN.length;
const clamp=(x,a=0,b=1)=>Math.min(b,Math.max(a,x));
const eo=x=>1-Math.pow(1-clamp(x),3);
const eio=x=>{x=clamp(x);return x<.5?4*x*x*x:1-Math.pow(-2*x+2,3)/2};
const eb=x=>{x=clamp(x);const c1=1.9,c3=c1+1;return 1+c3*Math.pow(x-1,3)+c1*Math.pow(x-1,2)};
const $=id=>document.getElementById(id);
const tw=(s,k,st,cps)=>s.slice(0,Math.floor(clamp(k-st,0,99)*cps));
const esc=s=>String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;');
let _s=(SPEC.seed||7)>>>0||1;const R=()=>(_s=(Math.imul(_s,1664525)+1013904223)>>>0)/4294967296;
const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(R()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};

// bokeh
const bk=$('bokeh');const BK=[];
for(let i=0;i<22;i++){const d=document.createElement('div');d.className='bk';const s=40+((i*37)%90);d.style.cssText=`width:${s}px;height:${s}px;left:${(i*173)%1000}px;top:${(i*289)%1850}px;opacity:${.12+((i*13)%10)/50}`;bk.appendChild(d);BK.push([d,(i%5+1)*7,(i%7+1)*5])}

// ---------- content pools (English names only)
const SND=['Sarah Mitchell','Stripe','LinkedIn','Amazon','Notion','James Carter','Chase','Zoom','Calendly','Figma','Uber Eats','Google Workspace','Daniel Reed','Slack','GitHub','Emily Brooks','Olivia Hayes','Netflix'];
const SBJ=['Re: Q4 numbers, can you reply?','Your invoice is ready','5 new people viewed your profile','Your order has shipped','Following up on my last email','Meeting moved to 4 PM','Action needed: verify your account','Quick question about the proposal','New comment on your design','Reminder: payment due tomorrow','Are you free this week?','50% off ends tonight','Weekly digest','Can we reschedule?','Please review the attached','Your subscription renews soon'];
const COL=['#2563EB','#7c3aed','#0891b2','#db2777','#059669','#d97706','#4f46e5','#e11d48'];
function inbox(el,seed,num,promo){

function chatT(id,userText,k){

function macIn(el,k,fromX,rotY,rotX){

  el.style.opacity=o;
  el.style.transform=`translateX(${(1-p)*fromX}px) rotateY(${rotY*(1-.35*clamp(k/3.5))}deg) rotateX(${rotX}deg) rotateZ(${-1.2*(1-p)}deg) scale(${(.94+.06*p+k*.004)*(el.dataset.s||1)})`;
}
function textIn(k,kickEl,bigEl,kd,bd){
  const a=eb((k-kd)/.35),b=eb((k-bd)/.35);
  kickEl.style.opacity=clamp((k-kd)/.1);kickEl.style.transform=`translateY(${(1-a)*40}px)`;

}

// ---------- cutaways (hard-cut punch-ins)
const CW=SCHED.cw||[];const CWD=.7;
function cutaway(t){
  let w=null;for(const c of CW){if(t>=c.t&&t<c.t+CWD)w=c}
  const cut=$('cut');
  if(!w){cut.style.display='none';return 0}
  const k=t-w.t,p=k/CWD;cut.style.display='block';
  ['cA','cB','cC','cD'].forEach(i=>$(i).style.display='none');
  const el=$('c'+w.k);el.style.display='flex';
  const inn=eb(k/.3),out=clamp((CWD-k)/.1);
  cut.style.opacity=clamp(k/.05)*out;
  el.style.transform=`scale(${.82+.18*inn+p*.05})`;
  if(w.k==='A'){
    ['nA1','nA2','nA3'].forEach((id,i)=>{const n=w.notifs[i];$(id).querySelector('b').textContent=n[0];$(id).querySelector('span').textContent=n[1];const q=eb((k-.04-.08*i)/.3);$(id).style.transform=`translateY(${(1-q)*-160}px) scale(${.9+.1*q})`;$(id).style.opacity=clamp((k-.04-.08*i)/.06)});
    $('bA').textContent=w.badge;$('bA').style.transform=`scale(${.4+.6*eb((k-.25)/.25)})`;$('bA').style.opacity=clamp((k-.25)/.05)}
  if(w.k==='B'){
    ['eB1','eB2','eB3'].forEach((id,i)=>{const e=w.events[i];$(id).innerHTML=`${e[0]}<small>${e[1]}</small>`;const q=eb((k-.04-.09*i)/.3);$(id).style.transform=`translateX(${(1-q)*(i%2?500:-500)}px)`;$(id).style.opacity=clamp((k-.04-.09*i)/.06)});
    $('lB').textContent=w.label;$('lB').style.opacity=clamp((k-.35)/.1);$('lB').style.transform=`scale(${.85+.15*eb((k-.35)/.25)})`}
  if(w.k==='C'){const n=Math.floor(clamp(k/.55)*w.text.length);$('tC').textContent=w.text.slice(0,n);$('subC').textContent=w.sub;$('curC').style.opacity=(Math.floor(k*10)%2)?0:1}
  if(w.k==='D'){$('dT').textContent=w.a;$('dS').textContent=w.b}
  return 1;
}
